<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Management</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Product Management</h1>
      <span id="statCount">0 products</span>
    </header>

    <main>
      <section class="card">
        <h2 id="formTitle">New Product</h2>
        <form id="productForm">
          <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" required maxlength="120" autocomplete="off">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="price">Price</label>
              <input type="number" id="price" required min="0" step="0.01">
            </div>
            <div class="form-group">
              <label for="discount">Discount</label>
              <input type="number" id="discount" min="0" step="0.01">
            </div>
          </div>

          <div class="total-display">
            <span>Total:</span>
            <strong id="totalValue">—</strong>
          </div>

          <div class="form-row">
            <div class="form-group" id="countGroup">
              <label for="count">Quantity</label>
              <input type="number" id="count" min="1" max="100">
            </div>
            <div class="form-group">
              <label for="category">Category</label>
              <input type="text" id="category" maxlength="60" autocomplete="off">
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="submitBtn">Create Product</button>
            <button type="reset" class="btn btn-secondary" id="resetBtn">Reset</button>
          </div>
        </form>
      </section>

      <section class="card">
        <div class="card-header">
          <h2>Products</h2>
          <button type="button" class="btn btn-danger-sm hidden" id="deleteAllBtn">Delete All</button>
        </div>

        <div class="search-row">
          <input type="text" id="search" autocomplete="off">
          <div class="filter-actions">
            <button type="button" class="btn-filter active" id="pillTitle">By Title</button>
            <button type="button" class="btn-filter" id="pillCategory">By Category</button>
            <button type="button" class="btn-filter hidden" id="pillClear" title="Clear search">&times;</button>
          </div>
        </div>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Title</th>
                <th class="text-right">Price</th>
                <th class="text-right">Discount</th>
                <th class="text-right">Total</th>
                <th>Category</th>
                <th class="text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>

          <div class="empty-state hidden" id="emptyState">
            <p>No products found.</p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="index.js"></script>
</body>
</html>
